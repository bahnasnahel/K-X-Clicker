<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>K'X - Portraits</title>
<style>
:root{--n1:#090615;--n2:#1E1142;--n3:#2E1766;--v:#9A6BFF;--m:#D36BFF;--l:#ECE6FA;--or:#FFD479}
*{box-sizing:border-box}
body{margin:0;background:var(--n1);color:var(--l);font-family:system-ui,sans-serif;padding:16px}
h1{font:14px/1.4 monospace;color:var(--v);margin:0 0 16px}
.card{display:flex;gap:12px;align-items:center;background:var(--n2);border:2px solid var(--n3);padding:10px;margin-bottom:10px;min-height:44px;width:100%;color:inherit;text-align:left;font:inherit}
.frame{flex:none;width:72px;height:72px;padding:3px;background:var(--n3);border:3px solid var(--v);box-shadow:0 0 0 2px var(--n1)}
.frame img{display:block;width:100%;height:100%;image-rendering:auto}
.card.on .frame{border-color:var(--v);box-shadow:0 0 0 2px var(--or),0 0 10px var(--or)}
.nm{font:12px monospace;color:var(--or)} .card:not(.on) .nm{color:var(--l)}
.rl{font-size:13px;opacity:.8}
.bubble{display:flex;gap:10px;align-items:flex-start;margin-top:18px}
.bubble .frame{width:56px;height:56px}
.bubble p{margin:0;background:var(--n2);border:2px solid var(--m);padding:10px;font-size:14px;position:relative;flex:1}
.bubble p:before{content:"";position:absolute;left:-8px;top:14px;border:6px solid transparent;border-right:8px solid var(--m);border-left:0}
</style></head><body>
<h1>APERCU DES CADRES (touche un perso pour le rendre actif)</h1>
<div id="l"></div>
<div class="bubble"><div class="frame"><img src="assets/photos/jadd.webp" alt=""></div><p>Il fait chaud ici. J'ouvre la fenetre, c'est pour ca qu'on m'a embauche.</p></div>
<div class="bubble"><div class="frame"><img src="assets/photos/noah.webp" alt=""></div><p>Attaque bloquee. Rien ne passe.</p></div>
<script>
const t=[["nahel","Nahel","Le joueur"],["yanis","Yanis","Fondateur tech"],["noah","Noah","Cybersecurite"],["jadd","Jadd Barnas","Ingenieur ouvreur de fenetres"]];
const l=document.getElementById('l');
t.forEach((p,i)=>{const b=document.createElement('button');b.className='card'+(i==0?' on':'');
b.innerHTML=`<div class="frame"><img src="assets/photos/${p[0]}.webp" alt="${p[1]}"></div><div><div class="nm">${p[1]}</div><div class="rl">${p[2]}</div></div>`;
b.onclick=()=>{l.querySelectorAll('.card').forEach(c=>c.classList.remove('on'));b.classList.add('on')};l.appendChild(b)});
</script></body></html>
