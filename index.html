<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#090615">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>K'X Clicker</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icons/icon-192.png">
<link rel="apple-touch-icon" href="assets/icons/icon-192.png">
<link rel="preload" href="assets/fonts/press-start-2p.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <header id="top">
    <div class="deskwrap">
      <canvas id="desk" aria-label="Bureau K'X"></canvas>
      <div class="deskbtns">
        <button id="btn-sound" class="iconbtn" aria-label="Couper le son"></button>
        <button id="btn-gear" class="iconbtn" aria-label="Réglages"></button>
      </div>
      <div id="desk-label" class="desklabel"></div>
    </div>
    <div class="counters">
      <button class="cnt gold" id="cell-money" data-help="money"><span class="lb">Argent</span><span class="val" id="c-money">0</span><span class="unit">EUR</span><i class="q">?</i></button>
      <button class="cnt" id="cell-hours" data-help="hours" hidden><span class="lb">Heures</span><span class="val" id="c-hours">0</span><span class="unit">H</span><i class="q">?</i></button>
      <button class="cnt gauge" id="stress-cell" data-help="stress" hidden><span class="lb">Stress</span><span class="val" id="c-stress">0 %</span><i class="bar"><b id="bar-stress"></b></i><i class="q">?</i></button>
      <button class="cnt gauge" id="heat-cell" data-help="heat" hidden><span class="lb">Chaleur</span><span class="val" id="c-heat">0 %</span><i class="bar"><b id="bar-heat"></b></i><i class="q">?</i></button>
    </div>
  </header>
  <main id="main"></main>
  <nav id="tabbar" role="tablist"></nav>
</div>
<noscript>K'X Clicker a besoin de JavaScript.</noscript>
<script type="module" src="js/main.js"></script>
</body>
</html>
